# EXAMPLE reverse-proxy config, to apply on whichever machine terminates TLS.
#
# This file is no longer used by docker-compose.yml - the app now speaks plain
# HTTP on 8080 and expects TLS to be handled separately. It is kept because two
# things in here are not obvious and are easy to lose when the proxy moves to
# someone else's machine: the feed-token log masking, and the header forwarding
# the app depends on. Adapt the addresses, drop it in, and read the two notes
# below before deciding you don't need them.
#
# Substitute for your deployment:
#   - CALENDARSYNC_UPSTREAM  the app host:port, e.g. 10.0.0.7:8080
#   - server_name            your real hostname
#   - ssl_certificate paths  wherever certbot or your CA put them

upstream calendarsync {
    # The app. Must be reachable from this proxy and, ideally, from nowhere
    # else - the app has no TLS and no network-level auth of its own.
    server 10.0.0.7:8080;
}

# Vaadin's server push upgrades to WebSocket, but most requests are ordinary
# HTTP. Sending "Connection: upgrade" on those too breaks keep-alive to the
# backend, so mirror whatever the client actually asked for.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# NOTE 1 of 2 - do not skip this when adapting the file.
#
# /feed/{token}.ics puts a bearer credential in the URL path - that is the whole
# design of the endpoint, since calendar clients can't log in. The consequence is
# that a default access log records every subscriber's feed token in cleartext,
# on every poll, forever: anyone who can read the log (or a shipped-off copy of
# it) can subscribe to those calendars. Log the path with the token masked.
#
# This matters MORE now that the proxy is a separate machine, not less - its logs
# are somewhere the app's operator may not be watching, and may be shipped to a
# central log store by default.
map $request_uri $logged_request_uri {
    ~^/feed/    "/feed/[token-redacted].ics";
    default     $request_uri;
}

log_format masked_tokens '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $logged_request_uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Don't advertise the exact nginx version to every caller.
server_tokens off;

server {
    listen 80;
    server_name _;

    # Per-server, not http-level: the stock nginx.conf already declares an
    # access_log in http{} with the unmasked "main" format, and a second
    # http-level declaration would add a line rather than replace one - the
    # token would still be written, just twice. A server-level access_log
    # overrides it for this server. Needed on the plain-http listener too: a
    # client that subscribes over http gets its token logged here before the
    # redirect ever reaches the TLS listener.
    access_log /var/log/nginx/access.log masked_tokens;

    # Redirect everything to HTTPS except Let's Encrypt's HTTP-01 challenge,
    # if you're using certbot in webroot mode instead of bringing your own cert.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log masked_tokens;

    location / {
        proxy_pass http://calendarsync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # NOTE 2 of 2 - do not skip this either.
        #
        # The app rate-limits password guessing by client IP, and takes that IP
        # from X-Forwarded-For. It only honours the header from source addresses
        # in CALENDARSYNC_TRUSTED_PROXIES, so this proxy's address must be in
        # that list or the throttle will key on the proxy instead of the caller
        # and lock everyone out at once.
        #
        # $proxy_add_x_forwarded_for APPENDS to any header the client already
        # sent. That is correct only because the app resolves the client by
        # walking the chain right-to-left past trusted hops. If you put another
        # proxy in front of this one, add it to the trusted list too - otherwise
        # a client-supplied value becomes the "client IP" the throttle believes.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tells the app its externally-visible scheme, so redirects it builds
        # are https and the session cookie is accepted as Secure.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vaadin's server push (used for live UI updates) needs WebSocket upgrade support.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
